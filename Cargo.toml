[package]
name = "tree-lens"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A read-only disk usage tree for macOS"
license = "MIT"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd"]

[dependencies]
eframe = { version = "=0.31.1", optional = true, default-features = false, features = ["default_fonts", "glow", "x11"] }

[target.'cfg(target_os = "macos")'.dependencies]
rfd = { version = "=0.15.4", optional = true, default-features = false }

[[bin]]
name = "tree-lens"
path = "src/main.rs"
required-features = ["gui"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
