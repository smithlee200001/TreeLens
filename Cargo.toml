[package]
name = "tree-lens"
version = "0.5.0"
edition = "2021"
resolver = "3"
rust-version = "1.92"
description = "A native GPUI Kit disk usage observatory for macOS, Windows, Debian and Ubuntu"
license = "MIT"

[features]
default = ["gui"]
gui = ["dep:gpui-kit"]
ui-tests = ["gui", "gpui-kit/test-support"]

[dependencies]
gpui-kit = { version = "=0.9.0", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSFileManager", "NSError", "NSString", "NSURL"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_IO", "Win32_System_Ioctl", "Win32_UI_Shell"] }
windows-core = "=0.61.2"

[[bin]]
name = "tree-lens"
path = "src/main.rs"
required-features = ["gui"]

[[example]]
name = "ui_snapshot"
path = "examples/ui_snapshot.rs"
required-features = ["ui-tests"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
