name: Windows checks
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test core without GUI dependencies
        run: cargo test --locked --no-default-features --lib --target x86_64-pc-windows-msvc
      - name: Test core and GPUI UI logic
        run: cargo test --locked --features ui-tests --all-targets --target x86_64-pc-windows-msvc
      - name: Strict Clippy
        run: cargo clippy --locked --features ui-tests --all-targets --target x86_64-pc-windows-msvc -- -D warnings
      - name: Build and package full release GUI
        run: ./scripts/bundle-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Tree-Lens-Windows-x64-development
          path: dist/Tree-Lens-Windows-x64.zip
          if-no-files-found: error
